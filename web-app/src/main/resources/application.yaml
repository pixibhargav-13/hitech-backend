server:
  port: 8080

spring:
  application:
    name: hitech-erp
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hitech_erp}
    username: ${DB_USER:hitech}
    password: ${DB_PASSWORD:hitech}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    # Schema only by default. Sample data lives in db/seed and is a separate location, switched on
    # per environment with FLYWAY_LOCATIONS — so a demo database can be filled without the risk of
    # sample rows ever riding into an environment that did not ask for them:
    #   FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    # Once the seed location is switched off again, its applied versions are still in the history
    # table with no file behind them. Without this, Flyway treats that as a corrupted schema and
    # refuses to start — which would turn "stop seeding" into "the app will not boot".
    ignore-migration-patterns: "*:missing"

# Self-issued JWT config - see JwtTokenProvider. Override JWT_SECRET in every real environment.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32b}
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:30}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@hitech.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
    full-name: ${BOOTSTRAP_ADMIN_NAME:Super Admin}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: [ health, info ]
